<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vehicle Data Pipeline{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f6f7fb; }
    .navbar-brand { font-weight:600; }
    .card { border:none; box-shadow:0 1px 6px rgba(0,0,0,.06); }
    .status-badge { font-size:.85rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'upload' %}">🚗 Vehicle Data Pipeline</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{% url 'upload' %}">Upload</a>
        <a class="nav-link" href="{% url 'job_list' %}">Jobs</a>
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
